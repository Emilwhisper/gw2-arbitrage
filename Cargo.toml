[package]
name = "gw2-arbitrage"
version = "2.3.2"
description = "Finds items in Guild Wars 2 that can be sold on the trading post for a higher price than the cost of crafting the item"
authors = ["Tobias Mansfield-Williams <contact@tmwhere.com>"]
repository = "https://github.com/t-mw/gw2-arbitrage"
license = "MIT"
edition = "2018"

[dependencies]
bincode = "1.2"
colored = "1.9"
csv = "1.1"
dirs = "3.0"
flate2 = "1.0"
futures = "0.3"
num-rational = "0.3"
num-traits = { version = "0.2", default-features = false }
once_cell = "1.8"
rayon = "1.3"
reqwest = { version = "0.11", features = ["json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
structopt = "0.3"
tokio = { version = "1.0", features = ["full"] }
toml = "0.4"
phf = { version = "0.9", features = ["macros"] }
lazy_static = "1.4"
strum = { version = "0.23", features = ["derive"] }
eframe = "0.27"
egui_extras = "0.27"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.12"
