# CI for the GUI development branch: build + test on every push, targeting
# Windows-first as per todo.md. Artifacts (gw2-arbitrage.exe) are uploaded on
# every run so testers can grab the latest binary without tagging a release.
name: GUI CI

on:
  push:
    branches:
      - GUI-test
  pull_request:
    branches:
      - master

jobs:
  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked

      - name: Run cargo build (release)
        run: cargo build --release --locked

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw2-arbitrage-windows-x64
          path: target/release/gw2-arbitrage.exe
          if-no-files-found: error

  check:
    name: Check (ubuntu, fast feedback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked
