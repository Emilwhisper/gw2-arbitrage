# CI for the GUI: builds + tests on every push to any branch (so feature
# branches such as Filter-test are compiled too), Windows-first as per todo.md.
# Artifacts (gw2-arbitrage.exe) are uploaded on every run so testers can grab the
# latest binary without tagging a release.
name: GUI CI

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked

      - name: Run cargo build (release)
        run: cargo build --release --locked

      - name: Verify the binary is GUI-subsystem (no console window)
        shell: pwsh
        run: |
          $exe = "target/release/gw2-arbitrage.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem = $subsystem (2 = GUI/no console, 3 = console)"
          if ($subsystem -ne 2) {
            throw "Expected GUI subsystem so double-clicking opens no console window, got $subsystem"
          }

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw2-arbitrage-windows-x64
          path: target/release/gw2-arbitrage.exe
          if-no-files-found: error

  check:
    name: Check (ubuntu, fast feedback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install system dependencies (GTK for rfd/eframe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked
