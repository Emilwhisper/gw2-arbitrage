# Release workflow: pushing a `v*` tag builds the Windows release, zips it and
# creates a GitHub Release named "gw2-arbitrageUI".
#
# Notes for future maintainers:
# - `permissions: contents: write` is required for GITHUB_TOKEN to create the
#   release; without it `softprops/action-gh-release` fails with a 403.
# - This replaces an older workflow that relied on the archived `actions-rs/*`
#   actions, the retired `ubuntu-18.04` runner and the now-disabled `::set-output`
#   workflow command, none of which work on GitHub any more.
# - Only Windows is built (the target platform). To restore macOS/Linux, copy the
#   `build-windows` job: on Linux add `sudo apt-get install -y libgtk-3-dev`
#   (`rfd`/`eframe` need GTK headers to build and the GTK runtime to run), and on
#   macOS check the artifact name (the old one wrongly said x86_64).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      # Style checks are deliberately non-blocking: pre-existing warnings must not
      # be able to prevent a release from being published.
      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy
        continue-on-error: true
        run: cargo clippy --all-targets

  build-windows:
    name: Build Release (Windows)
    runs-on: windows-latest
    needs: [check]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Determine version and asset name
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset=gw2-arbitrageUI-$version-x86_64-pc-windows-msvc.zip" >> $env:GITHUB_OUTPUT

      - name: Build release
        run: cargo build --release --locked

      - name: Verify the binary is GUI-subsystem (no console window)
        shell: pwsh
        run: |
          $exe = "target/release/gw2-arbitrage.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [System.BitConverter]::ToUInt16($bytes, $peOffset + 0x5C)
          Write-Host "PE subsystem = $subsystem (2 = GUI/no console, 3 = console)"
          if ($subsystem -ne 2) {
            throw "Expected GUI subsystem so double-clicking opens no console window, got $subsystem"
          }

      - name: Zip the executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./gw2-arbitrage | Out-Null
          Copy-Item ./target/release/gw2-arbitrage.exe ./gw2-arbitrage/
          Compress-Archive -Path ./gw2-arbitrage/* -DestinationPath "./${{ steps.version.outputs.asset }}" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: gw2-arbitrageUI
          fail_on_unmatched_files: true
          files: ${{ steps.version.outputs.asset }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
